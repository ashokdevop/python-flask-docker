name: CI/CD Pipeline testing Github actions

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10.16
        uses: actions/setup-python@v4
        with:
          python-version: 3.10.16

      - name: Install Dependencies for the app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: |
          docker build -t Python/flask-image:latest .

      - name: Log in to Docker Hub
        uses: azure/docker-login@v1
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: push it to ACR
        uses: docker/build-push-action@v5
        with:
         push: true
         tags: ${{ secrets.REGISTRY_LOGIN_SERVER }}/Python/flask-image:latest:${{ github.sha }}
